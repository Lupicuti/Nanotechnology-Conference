<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #070B14;
            --cyan: #00F0FF;
            --indigo: #6366F1;
        }
        body {
            margin: 0;
            padding: 50px;
            background: transparent;
            display: inline-block;
            font-family: 'Outfit', sans-serif;
        }
        .qr-card {
            background: var(--bg-deep);
            border-radius: 30px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Gradient Border */
            border: 4px solid transparent;
            background-clip: padding-box, border-box;
            background-origin: padding-box, border-box;
            background-image: linear-gradient(var(--bg-deep), var(--bg-deep)), linear-gradient(135deg, var(--cyan) 0%, var(--indigo) 100%);
            /* Glow */
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(99, 102, 241, 0.15);
            position: relative;
        }
        .header {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00F0FF 0%, #6366F1 50%, #3B82F6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.4));
            text-align: center;
        }
        .qr-container {
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 25px;
        }
        .qr-container img {
            width: 300px;
            height: 300px;
            display: block;
        }
        .footer {
            color: #A0ABC0;
            font-size: 20px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
        }
        .footer span {
            color: var(--cyan);
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="qr-card" id="qr-card">
        <div class="header">JOIN NANOS 2026</div>
        <div class="qr-container">
            <!-- Using absolute path or local file relative -->
            <img src="site_qr_code.png" alt="QR Code">
        </div>
        <div class="footer">SCAN TO <span>REGISTER</span></div>
    </div>
</body>
</html>
